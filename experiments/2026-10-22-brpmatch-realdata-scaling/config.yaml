# Real-data BRPMatch scaling benchmark (no outcome). Cohort built in Spark SQL
# from the CDR; every size/ratio change below is a Spark filter, not pandas.
entrypoint: python experiments/2026-10-22-brpmatch-realdata-scaling/bench.py
sql_file: experiments/2026-10-22-brpmatch-realdata-scaling/cohort.sql
cdr_tables: [person, condition_occurrence, concept_ancestor, visit_occurrence]

sql_params:
  treatment_concept_id: 316866   # hypertensive disorder (and descendants)
  population_pct: 100            # deterministic share of all EHR persons

# Covariates (columns produced by cohort.sql).
exact_match_cols: [gender_concept_id]
numeric_cols: [year_of_birth, log_visits, log_conditions]
categorical_cols: [race_concept_id, ethnicity_concept_id]

feature_space: mahalanobis
ratio_k: 1
with_replacement: false
n_neighbors: 5

# One matching run per entry, on the same cached cohort. treated_pct /
# control_pct keep people with person_id mod 100 < pct in each group (the
# same rule as the MatchIt comparison, so both match identical subsets);
# threshold = rebucket threshold; n_neighbors overrides the default above.
#
# Current step: one full-cohort run at n_neighbors 5 with the unmatched
# diagnostics, to tell avoidable losses from treated that are hard to match.
runs:
  - {treated_pct: 100, control_pct: 100, threshold: 10000, n_neighbors: 5}
  # Only if best possible within buckets is well above actual matched:
  # - {treated_pct: 100, control_pct: 100, threshold: 10000, n_neighbors: 20}
  # - {treated_pct: 100, control_pct: 100, threshold: 10000, n_neighbors: 50}
  # Done 2026-10-22 (size ladder for the MatchIt comparison; see README):
  # - {treated_pct: 1, control_pct: 1, threshold: 10000}
  # - {treated_pct: 5, control_pct: 5, threshold: 10000}
  # - {treated_pct: 10, control_pct: 10, threshold: 10000}
  # - {treated_pct: 25, control_pct: 25, threshold: 10000}
  # - {treated_pct: 50, control_pct: 50, threshold: 10000}

# Unmatched diagnostics (per run): coarse cell = exact-match group x
# birth_band_years band of birth_col x condition_quantiles quantile bins of
# conditions_col.
diagnostics:
  enabled: true
  birth_col: year_of_birth
  conditions_col: log_conditions
  birth_band_years: 5
  condition_quantiles: 5

# Suppression: participant counts from 1 to min_cell (inclusive) are never shown.
min_cell: 20
