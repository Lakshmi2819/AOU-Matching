# Real-data BRPMatch scaling benchmark (no outcome). Cohort built in Spark SQL
# from the CDR; every size/ratio change below is a Spark filter, not pandas.
entrypoint: python experiments/2026-10-22-brpmatch-realdata-scaling/bench.py
sql_file: experiments/2026-10-22-brpmatch-realdata-scaling/cohort.sql
cdr_tables: [person, condition_occurrence, concept_ancestor, visit_occurrence]

sql_params:
  treatment_concept_id: 316866   # hypertensive disorder (and descendants)
  population_pct: 100            # deterministic share of all EHR persons

# Covariates (columns produced by cohort.sql).
exact_match_cols: [gender_concept_id]
numeric_cols: [year_of_birth, log_visits, log_conditions]
categorical_cols: [race_concept_id, ethnicity_concept_id]

feature_space: mahalanobis
ratio_k: 1
with_replacement: false
n_neighbors: 5

# One matching run per entry, on the same cached cohort. treated_pct /
# control_pct keep people with person_id mod 100 < pct in each group (the
# same rule as the MatchIt comparison, so both match identical subsets);
# threshold = rebucket threshold; n_neighbors and bucket_length_multiplier
# override the defaults above. A run that fails is reported and skipped.
#
# Current step (branch brp-tuning, from the 2026-11-16 call with Shawn), all on
# the 25% subset (51,368 treated / 56,362 controls; k5 there matched 55.1%,
# max |SMD| 0.409 in 456 s), one setting changed at a time:
#   1. n_neighbors 10 vs 5 (1:1), with the unmatched diagnostics.
#   2. rebucket threshold in multiples at multiplier 1, then bucket length
#      multiplier at a high threshold (40,000). match() L2-normalizes vectors,
#      so projections lie in [-1, 1], and the base bucket length at multiplier 1
#      is about 2-3 here (printed per run): any multiplier above ~0.35-0.5 gives the same top-level
#      buckets (local check: 0.5, 1 and 4 identical; 4 also stopped
#      rebucketing). Only smaller multipliers change bucket size.
# Riskiest runs (largest buckets) last.
runs:
  - {treated_pct: 25, control_pct: 25, threshold: 10000, n_neighbors: 5, diagnostics: true}
  - {treated_pct: 25, control_pct: 25, threshold: 10000, n_neighbors: 10, diagnostics: true}
  - {treated_pct: 25, control_pct: 25, threshold: 1250}
  - {treated_pct: 25, control_pct: 25, threshold: 2500}
  - {treated_pct: 25, control_pct: 25, threshold: 5000}
  - {treated_pct: 25, control_pct: 25, threshold: 40000, bucket_length_multiplier: 0.05}
  - {treated_pct: 25, control_pct: 25, threshold: 40000, bucket_length_multiplier: 0.1}
  - {treated_pct: 25, control_pct: 25, threshold: 40000, bucket_length_multiplier: 0.2}
  - {treated_pct: 25, control_pct: 25, threshold: 40000, bucket_length_multiplier: 0.3}
  - {treated_pct: 25, control_pct: 25, threshold: 20000}
  - {treated_pct: 25, control_pct: 25, threshold: 40000}
  # Done (see README):
  # 2026-10-29 / 2026-11-01, full cohort with diagnostics:
  # - {treated_pct: 100, control_pct: 100, threshold: 10000, n_neighbors: 5}
  # 2026-11-01, failed before printing (cause not diagnosed):
  # - {treated_pct: 100, control_pct: 100, threshold: 10000, n_neighbors: 20}
  # 2026-10-22, size ladder for the MatchIt comparison:
  # - {treated_pct: 1, control_pct: 1, threshold: 10000}
  # - {treated_pct: 5, control_pct: 5, threshold: 10000}
  # - {treated_pct: 10, control_pct: 10, threshold: 10000}
  # - {treated_pct: 25, control_pct: 25, threshold: 10000}
  # - {treated_pct: 50, control_pct: 50, threshold: 10000}

# Unmatched diagnostics (per run): coarse cell = exact-match group x
# birth_band_years band of birth_col x condition_quantiles quantile bins of
# conditions_col.
diagnostics:
  enabled: false   # per run: diagnostics: true
  birth_col: year_of_birth
  conditions_col: log_conditions
  birth_band_years: 5
  condition_quantiles: 5
  # Capacity across the whole cohort: sum over cells of min(unmatched treated,
  # unused controls), one line per granularity.
  capacity_cells:
    - {birth_band_years: 5, condition_quantiles: 5}
    - {birth_band_years: 2, condition_quantiles: 10}

# Suppression: participant counts from 1 to min_cell (inclusive) are never shown.
min_cell: 20
